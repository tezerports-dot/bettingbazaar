# Core Infrastructure Architecture — L4 SNI passthrough template
#
# Purpose:
# - Route encrypted TLS streams by SNI before application decryption.
# - Preserve end-to-end TLS from client to owned backend service.
# - Forward client metadata to trusted downstream services with PROXY protocol v2.
#
# Operator requirements before production use:
# - Replace all *.example hostnames and 10.0.0.0/24 placeholders with owned domains
#   and private backend addresses.
# - Ensure every backend TLS endpoint is configured to accept and validate PROXY
#   protocol v2 only from this HAProxy tier.
# - Keep default/unmapped traffic fail-closed; do not forward it to unrelated hosts.
# - Document the topology, logs, health checks, rollback, and trusted-proxy boundary.

global
    log stdout format raw local0 notice
    maxconn 50000
    user haproxy
    group haproxy

    # Runtime API can be enabled by operators for controlled reload automation.
    # stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout client-fin 10s
    timeout server-fin 10s

frontend tls_ingress_multiplexer
    bind :443
    mode tcp

    # Inspect only enough bytes to read the TLS ClientHello and SNI value.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Owned-service SNI allow-list. Replace these with licensed operator domains.
    acl sni_app      req_ssl_sni -i app.example.com
    acl sni_api      req_ssl_sni -i api.example.com
    acl sni_identity req_ssl_sni -i identity.example.com

    # Fail closed for malformed TLS or unmapped SNI.
    tcp-request content reject if !sni_app !sni_api !sni_identity

    use_backend app_tls_backend      if sni_app
    use_backend api_tls_backend      if sni_api
    use_backend identity_tls_backend if sni_identity

backend app_tls_backend
    mode tcp
    balance source
    option tcp-check
    default-server inter 5s fall 3 rise 2
    server app_node_1 10.0.10.10:443 check send-proxy-v2
    # server app_node_2 10.0.10.11:443 check send-proxy-v2

backend api_tls_backend
    mode tcp
    balance source
    option tcp-check
    default-server inter 5s fall 3 rise 2
    server api_node_1 10.0.20.10:443 check send-proxy-v2
    # server api_node_2 10.0.20.11:443 check send-proxy-v2

backend identity_tls_backend
    mode tcp
    balance source
    option tcp-check
    default-server inter 5s fall 3 rise 2
    server identity_node_1 10.0.30.10:443 check send-proxy-v2
    # server identity_node_2 10.0.30.11:443 check send-proxy-v2
