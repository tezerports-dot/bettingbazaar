# GOVERNANCE: Read docs/governance/04-GOVERNANCE.md before editing this file.
# Kubernetes manifests (plan items 40 + 44, 2026-07-18). Runtime behavior is
# split by BB_RUNTIME_ROLE so API pods do short HTTP work, realtime pods own
# SSE/WebSocket clients, and scheduler pods own cron/game-cycle producers.
#
# Prereqs: a managed PostgreSQL (the only datastore), Redis Cluster, optional
# Kafka/Redpanda, managed Postgres, object storage/CDN, and bb-env secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bettingbazaar-api
  labels: { app: bettingbazaar, tier: api, color: blue }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: bettingbazaar, tier: api, color: blue }
  template:
    metadata:
      labels: { app: bettingbazaar, tier: api, color: blue }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: bettingbazaar, tier: api }
      containers:
        - name: api
          image: bettingbazaar:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: bb-env } }]
          env:
            - { name: BB_RUNTIME_ROLE, value: api }
            - { name: PG_POOL_SIZE, value: "20" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app-assets, mountPath: /app/backend/app-assets }
            - { name: storage, mountPath: /app/backend/storage }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits:   { cpu: "2",  memory: 2Gi }
      volumes:
        - { name: app-assets, emptyDir: {} }
        - { name: storage, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
