---
apiVersion: v1
kind: Service
metadata:
  name: bettingbazaar-api
spec:
  selector: { app: bettingbazaar, tier: api, color: blue }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: bettingbazaar-realtime
spec:
  selector: { app: bettingbazaar, tier: realtime, color: blue }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bettingbazaar-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bettingbazaar-api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bettingbazaar-realtime
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bettingbazaar-realtime }
  minReplicas: 2
  maxReplicas: 40
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bettingbazaar-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: bettingbazaar, tier: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bettingbazaar-realtime
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: bettingbazaar, tier: realtime }
