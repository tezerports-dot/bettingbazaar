# GOVERNANCE: Read docs/governance/04-GOVERNANCE.md before editing this file.
# Reproducible self-host stack (plan item 41, 2026-07-13) — the whole platform
# from scratch on any Docker host: app + PostgreSQL + Redis. Version-controlled
# environment definition; see deploy/README.md for the IaC decision record.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then set real secrets via a .env file next to this compose file (JWT_SECRET
# etc. — see .env.example at the repo root).
services:
  app:
    build: ..
    ports: ["8080:8080"]
    environment:
      # The datastore. There is no second one: every balance, order, bet and
      # identity is here, and the app refuses to boot without it.
      DATABASE_URL: postgresql://bb:bb@postgres:5432/bettingbazaar
      REDIS_URL: redis://redis:6379
      # Local plaintext Postgres → no TLS. NEVER use PG_SSL=false against a remote
      # money DB; pin the provider CA via PG_CA_CERT there (boot refuses no-verify).
      PG_SSL: "false"
      PORT: "8080"
    env_file: [".env"]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  # PostgreSQL 18 — the append-only BIGINT-paise money ledger and everything
  # else (matches the CI service). The schema is applied idempotently by the app
  # at boot; a failed apply fails startup rather than serving a half-built
  # database.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: bb
      POSTGRES_DB: bettingbazaar
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d bettingbazaar"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
