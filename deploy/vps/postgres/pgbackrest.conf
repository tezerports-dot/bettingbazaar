# GOVERNANCE: Read CLAUDE.md before editing this file.
# pgBackRest — continuous WAL archive + daily base backups (point-in-time recovery).
#
# The bucket, its endpoint and keys are NOT here: they arrive as PGBACKREST_*
# environment variables from deploy/vps/.env (BACKUP_S3_*, the same PRIVATE
# bucket as the nightly pg_dump, under its own `pitr/` prefix). See pitr-env.sh.
[global]
# The command written into restore_command (and used for remote calls): the
# wrapper, so recovery sees the same environment as the archive (bb-pgbackrest.sh).
cmd=/usr/local/bin/bb-pgbackrest
repo1-type=s3
repo1-path=/pitr
repo1-s3-uri-style=path
repo1-s3-region=auto
# Two full backups (weekly) and the WAL between them: ~2 weeks of any-second restore.
repo1-retention-full-type=count
repo1-retention-full=2
compress-type=zst
start-fast=y
process-max=2
# Asynchronous push, and a CAP on what may queue locally. Past the cap pgBackRest
# reports the segment archived and drops it: PITR has a gap, but the database
# disk never fills because the bucket is unreachable. A full disk stops the site.
archive-async=y
spool-path=/var/lib/postgresql/pgbackrest-spool
archive-push-queue-max=4GiB
log-level-console=info
log-level-file=off

[bb]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
