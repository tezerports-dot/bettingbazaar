# GOVERNANCE: Read CLAUDE.md before editing this file. (See sec.0 for the mandatory pre-edit checklist.)
#
# PostgreSQL 18 for the production VPS: 16 GB RAM, 8 cores, SSD — sharing the
# box with 7 Node processes (6 cluster workers + the scheduler), Redis,
# PgBouncer, Caddy and Docker. These are STARTING values: confirm them with
# the production-like load test (loadtest/, docs/governance/PGBOUNCER_AND_CLUSTER.md)
# before launch. The goal is stable latency, not the largest possible cache.
#
# Memory budget (approximate, worst case):
#   PostgreSQL shared_buffers            4.0 GB
#   PostgreSQL work_mem (50 conns x 2)  ~1.6 GB   (only under heavy sorting)
#   maintenance/autovacuum              ~1.0 GB   (only while they run)
#   Node: 7 x ~400 MB typical (700 MB restart cap)   ~3-5 GB
#   Redis maxmemory                      1.0 GB
#   PgBouncer, Caddy, Docker, OS        ~1.0 GB
#   left for the filesystem cache       ~3-4 GB
# Mounted read-only; started with `-c config_file=/etc/postgresql/postgresql.conf`.

listen_addresses = '*'
port = 5432

# ── Connections ─────────────────────────────────────────────────────────────
# PgBouncer opens at most max_db_connections (50); the rest is headroom for
# the migrate step, backups, monitoring and an operator's psql.
max_connections = 80
superuser_reserved_connections = 3
# A transaction left idle holds locks and a PgBouncer server connection.
idle_in_transaction_session_timeout = '120s'
tcp_keepalives_idle = 60

# ── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = '4GB'
huge_pages = try
work_mem = '16MB'
hash_mem_multiplier = 2.0
maintenance_work_mem = '512MB'
autovacuum_work_mem = '256MB'
# A planner hint (shared_buffers + expected OS cache), not an allocation.
effective_cache_size = '8GB'
temp_buffers = '8MB'

# ── Storage (SSD) ───────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 50

# ── CPU ─────────────────────────────────────────────────────────────────────
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ── WAL and checkpoints ─────────────────────────────────────────────────────
# Money database: every commit is durable. Never set synchronous_commit off.
wal_level = replica
synchronous_commit = on
full_page_writes = on
wal_compression = lz4
wal_buffers = '16MB'
min_wal_size = '1GB'
max_wal_size = '4GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
max_wal_senders = 5
archive_mode = off            # turn on with a real archive_command for PITR

# ── Autovacuum (bets, ledger and state tables are append/update heavy) ─────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 1000

# ── Observability ───────────────────────────────────────────────────────────
log_min_duration_statement = '500ms'
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = '1s'
log_temp_files = '16MB'
log_autovacuum_min_duration = '1s'
track_io_timing = on
log_line_prefix = '%m [%p] %q%u@%d '
