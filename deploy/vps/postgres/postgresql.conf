# GOVERNANCE: Read CLAUDE.md before editing this file. (See sec.0 for the mandatory pre-edit checklist.)
#
# PostgreSQL 18 for the production VPS: 12 GB RAM, 12 cores, NVMe (the owner's
# launch server, Shinjiru Advance VPS Pro, 2026-10-24) — sharing the box with
# 8 Node processes (4 api + 2 realtime workers, the scheduler and its
# standby), Redis, PgBouncer, Caddy and Docker. These are STARTING values:
# confirm them with the production-like load test (loadtest/,
# docs/governance/PGBOUNCER_AND_CLUSTER.md) before launch. The goal is stable
# latency, not the largest possible cache. On a bigger server raise
# shared_buffers to a quarter of RAM and effective_cache_size to half.
#
# Memory budget (approximate, worst case):
#   PostgreSQL shared_buffers            3.0 GB
#   PostgreSQL work_mem (50 conns x 2)  ~1.6 GB   (only under heavy sorting)
#   maintenance/autovacuum              ~0.8 GB   (only while they run)
#   Node: 8 x ~400 MB typical (900 MB restart cap)   ~3-4 GB
#   Redis maxmemory                      1.0 GB
#   PgBouncer, Caddy, Docker, OS        ~1.0 GB
#   left for the filesystem cache       ~1.5-2.5 GB
# Mounted read-only; started with `-c config_file=/etc/postgresql/postgresql.conf`.

listen_addresses = '*'
port = 5432

# ── Connections ─────────────────────────────────────────────────────────────
# PgBouncer opens at most max_db_connections (50); the rest is headroom for
# the migrate step, backups, monitoring and an operator's psql.
max_connections = 80
superuser_reserved_connections = 3
# A transaction left idle holds locks and a PgBouncer server connection.
idle_in_transaction_session_timeout = '120s'
tcp_keepalives_idle = 60

# ── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = '3GB'
huge_pages = try
work_mem = '16MB'
hash_mem_multiplier = 2.0
maintenance_work_mem = '384MB'
autovacuum_work_mem = '192MB'
# A planner hint (shared_buffers + expected OS cache), not an allocation.
effective_cache_size = '6GB'
temp_buffers = '8MB'

# ── Storage (SSD) ───────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 50

# ── CPU ─────────────────────────────────────────────────────────────────────
max_worker_processes = 12
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ── WAL and checkpoints ─────────────────────────────────────────────────────
# Money database: every commit is durable. Never set synchronous_commit off.
wal_level = replica
synchronous_commit = on
full_page_writes = on
wal_compression = lz4
wal_buffers = '16MB'
min_wal_size = '1GB'
max_wal_size = '4GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
max_wal_senders = 5
# Continuous WAL archive to the private backup bucket (pgBackRest), for
# point-in-time recovery. archive-wal.sh ships nothing and reports success while
# BACKUP_S3_BUCKET is unset, so turning this on can never fill the disk with
# unarchived WAL. archive_timeout closes a quiet segment within a minute, so a
# restore loses at most ~60 s of writes (RPO). DISASTER_RECOVERY.md §3.
archive_mode = on
archive_command = '/usr/local/bin/bb-archive-wal %p'
archive_timeout = '60s'

# ── Autovacuum (bets, ledger and state tables are append/update heavy) ─────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 1000

# ── Observability ───────────────────────────────────────────────────────────
log_min_duration_statement = '500ms'
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = '1s'
log_temp_files = '16MB'
log_autovacuum_min_duration = '1s'
track_io_timing = on
log_line_prefix = '%m [%p] %q%u@%d '
