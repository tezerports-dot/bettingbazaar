; GOVERNANCE: Read CLAUDE.md before editing this file. (See sec.0 for the mandatory pre-edit checklist.)
;
; PgBouncer between the Node workers and PostgreSQL — TRANSACTION pooling.
; Mounted by deploy/vps/docker-compose.prod.yml; the image's entrypoint writes
; userlist.txt from the service's DATABASE_URL, so no password is in this file.
;
; Why transaction pooling is safe for this codebase (checked 2026-10-09, see
; docs/governance/PGBOUNCER_AND_CLUSTER.md for the evidence and the tests):
;   - every transaction runs on ONE client (database/client.js withTransaction);
;   - advisory locks are transaction-scoped only (pg_advisory_xact_lock);
;   - no session SET, LISTEN/NOTIFY, temp tables, cursors or WITH HOLD;
;   - node-postgres sends parameterised queries as UNNAMED prepared
;     statements; max_prepared_statements also covers named ones if added.
;
; Sizing (8 cores, 16 GB; the starting point, re-measure with loadtest/):
;   7 Node processes x PG_POOL_SIZE 25 = 175 client connections at most, all
;   multiplexed onto default_pool_size 30 server connections (+10 reserve),
;   never more than max_db_connections 50 — PostgreSQL max_connections is 80.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 30
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 50
max_prepared_statements = 200

; A client waits at most this long for a server connection before its query
; fails (the app sees an error, the request fails fast instead of hanging).
query_wait_timeout = 30
; A transaction left open and idle is a leaked server connection.
idle_transaction_timeout = 120
server_idle_timeout = 300
server_lifetime = 3600
server_connect_timeout = 5
server_login_retry = 2
server_check_delay = 30
server_check_query = select 1
; Transaction mode: DISCARD ALL would run after every transaction; the app
; leaves no session state, so nothing to reset.
server_reset_query =
ignore_startup_parameters = extra_float_digits,options

; Admin console (SHOW POOLS / SHOW STATS) for the app's metrics collector.
admin_users = bb
stats_users = bb

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
