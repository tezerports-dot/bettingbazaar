    <!-- Tailwind is bundled by Vite/PostCSS — no CDN script needed -->

    <!--
      An importmap listing 40 packages from esm.sh used to sit here — react,
      but also mongoose, express, multer, helmet, jsonwebtoken and the rest of
      the SERVER's dependency tree, plus react-router-dom@7 which this repo
      removed in the v8 migration.

      Nothing consumed it. Vite resolves every import at build time and emits
      hashed bundles, so an importmap only ever applies to bare specifiers the
      browser is left to resolve itself — of which there are none here. It was
      dead weight served to every visitor, it advertised the backend stack and
      its versions to anyone viewing source, and it named a package the codebase
      had already dropped. Removed 2026-07-30.

      If a genuine need for an importmap appears, it belongs to the specific
      bare specifiers being left unbundled — never a mirror of package.json.
    -->
    <link rel="stylesheet" href="/src/index.css">
</head>
  <body class="bg-[#0B0E14] text-[#EAEAEA]">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
