# GOVERNANCE: Read docs/governance/04-GOVERNANCE.md before editing this file.
# Auto-merge Dependabot version bumps — but ONLY the low-risk ones, and ONLY
# after the full CI suite (tests, typecheck/build, npm audit, secret-scan) is
# green. This kills the manual-PR churn for routine patch/minor updates without
# ever letting an unreviewed change reach main un-gated.
#
# WHAT IS AND IS NOT AUTO-MERGED
#   • patch  (x.y.Z) → auto-merged. Bug/security fixes, lowest risk.
#   • minor  (x.Y.z) → auto-merged. Backward-compatible features.
#   • major  (X.y.z) → NEVER. Held for the individual validate-then-merge
#     playbook (read migration notes, run full CI + local suites + soak), the
#     same one used for ioredis 6. A money platform does not take
#     a major dependency change without a human in the loop.
#
# SUPPLY-CHAIN NOTE: auto-merge trades human eyes for CI gates. That is
# acceptable here because (a) required status checks below must pass first,
# (b) the CI `audit` job fails on any new high/critical advisory, and (c) the
# root `overrides` block pins the critical transitive deps. To be STRICTER,
# change the `if` below to patch-only (drop the semver-minor clause).
#
# REPO SETTINGS REQUIRED (one-time, in GitHub UI — this workflow can't set them):
#   • Settings → General → "Allow auto-merge" = ON.
#   • Settings → Branches → protect `main` with the CI jobs as REQUIRED checks
#     (test, typecheck-build, audit, secret-scan, sbom). `--auto` waits for them;
#     without required checks it would merge immediately, defeating the gate.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only ever act on Dependabot's own PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch & minor (never major)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label majors for manual validation
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --body $'Held: **major** version bump. Per policy this needs the individual validate-then-merge playbook (migration notes → full CI → local suites → soak), like ioredis 6 — never auto-merged.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "needs-manual-validation" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
