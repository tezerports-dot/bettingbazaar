# CI — the proof that money-path code actually runs.
#
# The single-store gate runs FIRST and needs no dependencies: it is pure Node
# over the working tree, so it fails in seconds rather than after an install.
# See CLAUDE.md for the rule it enforces and the exit criteria it counts.
#
# Unit tests need no database. The money-path suites run against a real
# PostgreSQL service container, because row locking, the negative-balance guard
# and the unique-tx_id idempotency gate are behaviours of the database and are
# not worth asserting against a fake. See vitest*.config.ts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The definition of done for the single-store architecture (CLAUDE.md).
  # Pure Node over the checked-out tree — no install, no services, so it reports
  # in seconds.
  #
  # It deliberately does NOT gate the other jobs. It stays red for the whole
  # removal (that is what it is for), and a `needs:` on it would skip the test,
  # typecheck, audit and sbom jobs for the entire migration — surrendering the
  # signal exactly when the work is riskiest. The failing check still blocks the
  # merge, which is the part that matters.
  single-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Single-store verification (PostgreSQL only)
        run: npm run check:no-mongo -- --verbose

  test:
    runs-on: ubuntu-latest
    services:
      # F-3: real Redis so the rate-limit store's cross-instance counter
      # sharing is proven, not assumed. AQ-7: Redis 8 (current major).
      redis:
        image: redis:8
        ports:
          - 6379:6379
      # The money database — the only database. Real Postgres so the
      # BIGINT-paise schema, the append-only + conserve-to-zero triggers and the
      # row-locked wallet path are PROVEN in CI rather than assumed. AQ-7 +
      # decision D-2: PostgreSQL 18 (the version production provisions).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # AQ-7 / governance §16 P-2: reproducible install from the committed
      # lockfile. `npm ci` fails (rather than silently resolving ranges) if
      # package.json and the lockfile disagree — production runs exactly this.
      - name: Install dependencies (reproducible)
        run: npm ci --legacy-peer-deps
      # The concurrency suites provoke constraint violations ON PURPOSE, and
      # Postgres logs every refused ERROR with its full statement. The runner
      # dumps the whole container log at teardown, which pushes vitest's output
      # and its failure annotations out of the retrievable window — the suite
      # fails and the reason is unreadable. A service container has no
      # `command:` key to pass server flags through, so turn the logging down at
      # runtime instead, before any suite runs.
      - name: Quiet expected Postgres error logging (keeps test output readable)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d bb_test -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET log_min_error_statement = 'panic';
          ALTER SYSTEM SET log_min_messages = 'fatal';
          SELECT pg_reload_conf();
          SQL
      # ── `--reporter=github-actions` on every suite, deliberately ────────────
      # Vitest's GitHub reporter emits `::error file=…,line=…::` workflow
      # commands, which GitHub turns into ANNOTATIONS on the check run. Those
      # are readable through the API; the raw step log frequently is not.
      #
      # The money suites run against real service containers, and those
      # containers log every expected constraint violation the concurrency
      # tests deliberately provoke — thousands of lines of "duplicate key value
      # violates unique constraint", by design. That output dominates the tail
      # of the job log, so "which assertion failed" can be genuinely unreadable
      # from the log alone. The annotation carries the file, the line and the
      # message regardless.
      - name: Unit tests (money math — no DB)
        run: npm run test:unit -- --reporter=default --reporter=github-actions
      # The wallet path: row locking, the negative-balance guard and the
      # unique-tx_id idempotency gate are behaviours of the database, so they are
      # proven against a real one (see vitest.pg.config.ts).
      - name: Postgres money-path tests (real Postgres)
        run: npm run test:pg -- --reporter=default --reporter=github-actions
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bb_test
          PG_SSL: 'false'
      # Horizontal-scale properties only a real Redis can prove: rate-limit
      # counters shared across instances, and SSE fan-out crossing instances.
      # Needs no database — see vitest.redis.config.ts.
      - name: Redis tests (real Redis — cross-instance behaviour)
        run: npm run test:redis -- --reporter=default --reporter=github-actions
        env:
          REDIS_URL: redis://localhost:6379
      # A passing suite proves nothing about a test that would pass anyway. Each
      # entry breaks one behaviour the money paths rely on and asserts the test
      # for it goes red. It refuses to run without a database rather than
      # reporting an unrun Postgres mutation as a hole that does not exist.
      - name: Mutation check (the suites actually bite)
        run: node scripts/mutation-check.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bb_test
          PG_SSL: 'false'

  # AQ-7 note: SAST is provided by CodeQL "default setup" — enabled once by the
  # owner in Settings -> Code security -> Code scanning (GitHub-managed, needs no
  # workflow file; a manual workflow requires that same repo setting to be on AND
  # conflicts with default setup). See PRODUCTION_READINESS.md.

  # AQ-7: dependency vulnerability gate. Blocking at HIGH — the tree is clean
  # today (npm audit fix cleared the ws/socket.io chain), so any NEW high/critical
  # advisory fails the build and forces a triage instead of shipping silently.
  #
  # The three panels have their OWN package.json and lockfile and are NOT npm
  # workspaces, so a root `npm audit` does not see them. It reported a clean
  # tree while admin-panel was carrying two high-severity advisories
  # (brace-expansion DoS, js-yaml DoS) that GitHub's Dependabot was reporting on
  # the default branch — the root `overrides` block had been updated and the
  # panels' had not. Each lockfile is audited on its own below so that drift
  # fails the build instead of being invisible to it.
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ['.', user-panel, admin-panel, merchant-panel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.project }}
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}

  # 2026 supply-chain: emit a CycloneDX Software Bill of Materials for the
  # production dependency tree and publish it as a build artifact. Uses npm's
  # native generator (no extra tooling). This is the inventory a CVE-response or
  # SLSA/attestation process consumes; artifact signing/provenance layer on top
  # of it when an image registry is introduced (see docs/governance/04-GOVERNANCE.md).
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: Generate CycloneDX SBOM (production deps)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  # AQ-7: secret scan. Reports leaked credentials in the diff/history. The
  # gitleaks action reads PR commits via the API, so it needs pull-requests:read.
  # Report-only for now via STEP-level continue-on-error (the job stays green
  # even on a finding or an action error) — promote to a required check once the
  # baseline is confirmed clean.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (reproducible)
        run: npm ci --legacy-peer-deps
      - name: Backend syntax check
        run: node --check backend/server.js
      # A deleted import with its call sites left behind is a ReferenceError
      # that PARSES, LINTS and passes every test that does not execute the line
      # — so it surfaces as a 500 on one route in production. The first run of
      # this found 29, including one on the bet-placement path and one that made
      # every merchant-authenticated request answer 500.
      - name: No orphaned references (deleted imports still called)
        run: npm run check:orphans
      # Nothing outside database/ writes SQL, imports the driver, or reaches the
      # folder by relative path. The single data layer is a boundary or it is a
      # directory name.
      - name: Data-layer boundary
        run: npm run check:db-boundary
      # Items 5+58: architecture validation — circular imports and governance
      # boundary violations (domain core importing routes, wallet importing
      # products) fail the build instead of waiting for human review.
      - name: Architecture validation (dependency-cruiser)
        run: npm run check:deps
      # Trap 7, mechanically: a number that GATES a transfer must be read from
      # the rows the write will lock. Four gates were once decided from a stored
      # copy of a balance while the movement touched the wallet.
      - name: Money decisions read the wallet
        run: npm run check:balance-reads
      # A migrated entity must be WRITTEN and READ in the same store. A split
      # write-here/read-there succeeds on the write, finds nothing on the read,
      # and errors nowhere — invisible to check:no-mongo, which counts
      # references rather than asking whether the replacement is complete.
      - name: Migration coherence (no entity split across stores)
        run: npm run check:coherence
      # The single-store gate is NOT repeated here, deliberately. It has its own
      # job, it stays red for the whole removal, and a copy of it in this job
      # would fail before the three panel builds below ever run — costing the
      # signal without adding any. Read it from the `single-store` job.
      # Capability registry drift check (CAP-06/CAP-59): every capability the
      # registry claims must have its evidence/docs/tests present on disk.
      - name: Capability registry verification
        run: npm run verify:capabilities
      # The user panel now carries logic worth testing on its own — origin
      # failover decides which host the app talks to when one stops answering,
      # and a silent regression there is an outage the build would not catch.
      - name: User panel typecheck + unit tests + build
        working-directory: user-panel
        run: npm ci --legacy-peer-deps && npx tsc --noEmit && npm test && npm run build
      - name: Admin panel typecheck + build
        working-directory: admin-panel
        run: npm ci --legacy-peer-deps && npx tsc --noEmit && npx vite build
      - name: Merchant panel typecheck + build
        working-directory: merchant-panel
        run: npm ci --legacy-peer-deps && npx tsc --noEmit && npx vite build
