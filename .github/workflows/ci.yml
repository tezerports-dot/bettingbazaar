# CI — the proof that money-path code actually runs.
# Unit tests (no DB) run always; integration tests boot an in-memory MongoDB
# (mongodb-memory-server downloads a mongod binary — reachable on GitHub
# runners, unlike the restricted build sandbox). See vitest*.config.ts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # F-3: real Redis so the rate-limit store's cross-instance counter
      # sharing is proven, not assumed. AQ-7: Redis 8 (current major).
      redis:
        image: redis:8
        ports:
          - 6379:6379
      # Hybrid money DB (plan steps 1-4): real Postgres so the BIGINT-paise
      # schema, append-only + conserve-to-zero triggers, dual-write hooks, and
      # the reconcile/backfill loop are PROVEN in CI. AQ-7 + decision D-2:
      # PostgreSQL 18 (the version the money cutover will provision).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # AQ-7 / governance §16 P-2: reproducible install from the committed
      # lockfile. `npm ci` fails (rather than silently resolving ranges) if
      # package.json and the lockfile disagree — production runs exactly this.
      - name: Install dependencies (reproducible)
        run: npm ci --legacy-peer-deps
      - name: Unit tests (money math — no DB)
        run: npm run test:unit
      # The Postgres-authoritative wallet path: row locking, the negative-balance
      # guard and the unique-tx_id idempotency gate are behaviours of the
      # database, so they are proven against a real one. Needs no MongoDB, which
      # is why it is a separate suite (see vitest.pg.config.ts).
      - name: Postgres money-path tests (real Postgres, no MongoDB)
        run: npm run test:pg
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bb_test
          PG_SSL: 'false'
      - name: Integration tests (real in-memory MongoDB + real Redis + real Postgres)
        run: npm run test:integration
        env:
          MONGOMS_VERSION: 7.0.14
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bb_test
          PG_SSL: 'false'

  # AQ-7 note: SAST is provided by CodeQL "default setup" — enabled once by the
  # owner in Settings -> Code security -> Code scanning (GitHub-managed, needs no
  # workflow file; a manual workflow requires that same repo setting to be on AND
  # conflicts with default setup). See PRODUCTION_READINESS.md.

  # AQ-7: dependency vulnerability gate. Blocking at HIGH — the tree is clean
  # today (npm audit fix cleared the ws/socket.io chain), so any NEW high/critical
  # advisory fails the build and forces a triage instead of shipping silently.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # 2026 supply-chain: emit a CycloneDX Software Bill of Materials for the
  # production dependency tree and publish it as a build artifact. Uses npm's
  # native generator (no extra tooling). This is the inventory a CVE-response or
  # SLSA/attestation process consumes; artifact signing/provenance layer on top
  # of it when an image registry is introduced (see docs/governance/04-GOVERNANCE.md).
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: Generate CycloneDX SBOM (production deps)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  # AQ-7: secret scan. Reports leaked credentials in the diff/history. The
  # gitleaks action reads PR commits via the API, so it needs pull-requests:read.
  # Report-only for now via STEP-level continue-on-error (the job stays green
  # even on a finding or an action error) — promote to a required check once the
  # baseline is confirmed clean.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (reproducible)
        run: npm ci --legacy-peer-deps
      - name: Backend syntax check
        run: node --check backend/server.js
      # Items 5+58: architecture validation — circular imports and governance
      # boundary violations (domain core importing routes, wallet importing
      # products) fail the build instead of waiting for human review.
      - name: Architecture validation (dependency-cruiser)
        run: npm run check:deps
      # Capability registry drift check (CAP-06/CAP-59): every capability the
      # registry claims must have its evidence/docs/tests present on disk.
      - name: Capability registry verification
        run: npm run verify:capabilities
      - name: User panel build
        working-directory: user-panel
        run: npm ci --legacy-peer-deps && npm run build
      - name: Admin panel typecheck + build
        working-directory: admin-panel
        run: npm ci --legacy-peer-deps && npx tsc --noEmit && npx vite build
      - name: Merchant panel typecheck + build
        working-directory: merchant-panel
        run: npm ci --legacy-peer-deps && npx tsc --noEmit && npx vite build
