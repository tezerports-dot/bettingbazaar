# GOVERNANCE: Read docs/governance/04-GOVERNANCE.md before editing this file.
# Builds the native Android app — a signed APK (sideload / direct download) and
# a signed AAB (Play Store upload).
#
# This runs in CI rather than on a laptop for two reasons: the signing key lives
# in repository secrets instead of on someone's machine, and the versionCode is
# derived mechanically. Play permanently rejects a re-upload of a versionCode it
# has already seen, and a hand-incremented number in a committed file is the
# classic way to lose an hour on release day.
name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.4.0)'
        required: true
        default: '1.0.0'
  push:
    tags: ['android-v*']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-panel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: user-panel/package-lock.json

      # Capacitor 8 targets a JDK 21 toolchain.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies (reproducible)
        run: npm ci --legacy-peer-deps

      # VITE_API_URL is mandatory and validated: inside the native shell
      # `window.location` is https://localhost, so without an absolute API
      # origin the app silently resolves its backend to the handset itself.
      # scripts/assert-native-env.mjs fails the build rather than shipping an
      # APK that installs, opens, and reaches nothing.
      - name: Build web bundle for the native shell
        run: npm run build:native
        env:
          VITE_API_URL: ${{ vars.ANDROID_API_URL }}
          VITE_MERCHANT_PANEL_URL: ${{ vars.ANDROID_MERCHANT_PANEL_URL }}
          # The public origin the bot builds sign-in links against. Its host is
          # what the App Link filter claims, and player auth is Telegram-only —
          # so an APK built without it is an APK nobody can sign in to.
          VITE_APP_ORIGIN: ${{ vars.ANDROID_APP_ORIGIN }}

      # The manifest placeholder is the App Link host, and it must be the same
      # host the web bundle was just told to trust. Deriving it here from the
      # one variable, rather than adding a second one to keep in step, is what
      # stops the two halves of the sign-in fix from silently disagreeing.
      - name: Resolve the App Link host
        env:
          O: ${{ vars.ANDROID_APP_ORIGIN }}
        run: |
          if [ -z "$O" ]; then
            echo "::error::The ANDROID_APP_ORIGIN repository variable is not set. It is your public site origin (the same value as the backend's PUBLIC_APP_ORIGIN), e.g. https://yourdomain.com — its host is what the app claims so the bot's sign-in links open the app instead of a browser. Without it players cannot sign in to the APK at all. See docs/governance/ANDROID_RELEASE_SETUP.md section 2."
            exit 1
          fi
          if ! HOST=$(node -e 'process.stdout.write(new URL(process.env.O).hostname)' 2>/dev/null); then
            echo "::error::ANDROID_APP_ORIGIN is not a valid URL: '$O'. Use an origin only, e.g. https://yourdomain.com (no path, no trailing slash)."
            exit 1
          fi
          echo "APP_LINK_HOST=$HOST" >> "$GITHUB_ENV"
          echo "App Link host: $HOST"

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Decoded from a secret to a path outside the workspace so it cannot be
      # picked up by a later step or archived into an artifact.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release build must be signed with the upload key — an unsigned or debug-signed artifact cannot be published and cannot update an existing install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#android-v}"; fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          # Monotonic across runs and never reused, which is Play's only hard
          # requirement. github.run_number is per-workflow and only increases.
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: user-panel/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PappLinkHost="$APP_LINK_HOST" \
            assembleRelease bundleRelease

      # An App Link that resolves to "localhost" is the build.gradle fallback,
      # which means ANDROID_APP_ORIGIN never reached Gradle. The APK would
      # install, open, and quietly refuse every sign-in link — exactly the class
      # of failure that only shows up on a handset, so it is caught here.
      - name: Verify the App Link host reached the manifest
        working-directory: user-panel/android
        run: |
          MANIFEST=app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          [ -f "$MANIFEST" ] || MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*release*' | head -1)
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::Could not find the merged release manifest to verify the App Link host."
            exit 1
          fi
          echo "Checking $MANIFEST"
          if ! grep -q "android:host=\"$APP_LINK_HOST\"" "$MANIFEST"; then
            echo "::error::The merged manifest does not claim $APP_LINK_HOST. Set the ANDROID_APP_ORIGIN repository variable — without it players cannot sign in to the app."
            grep -o 'android:host="[^"]*"' "$MANIFEST" || true
            exit 1
          fi

      # Proves the artifact carries the upload key rather than the debug key —
      # a debug-signed build installs fine on a test handset and is rejected by
      # Play, so the check belongs here and not at upload time.
      - name: Verify the APK is signed with the release key
        working-directory: user-panel/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          if "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed — the release keystore was not applied."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bettingbazaar-android-${{ env.VERSION_NAME }}
          path: |
            user-panel/android/app/build/outputs/apk/release/app-release.apk
            user-panel/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
