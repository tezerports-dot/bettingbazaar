  - id: CAP-10
    name: Database Transactions
    bucket: A
    owner: app
    implementation_status: partial
    activation_status: active
    evidence: [backend/domains/wallet/walletAuthority.service.js, backend/postgres/dualWrite.js]
    docs: [docs/governance/04-GOVERNANCE.md]
  - id: CAP-11
    name: CDC Migration
    bucket: decision
    owner: app
    implementation_status: decision
    activation_status: 'n/a'
    # DECIDED 2026-08-11: keep application dual-write; do NOT adopt CDC.
    # CDC (Debezium tailing the oplog into Kafka) solves "the mirror missed a
    # write under sustained load at scale". The mirrors are fire-and-forget and
    # reconcile.js is their backstop, which is sufficient at this volume — and
    # CAP-74, the Kafka backbone CDC would need, is architecture-ready and
    # unprovisioned. Revisit if reconcile reports drift the settling window
    # does not explain.
    decision_outcome: keep-dual-write
    docs: [docs/governance/04-GOVERNANCE.md]
  - id: CAP-12
    name: Dual-Write Migration
    bucket: decision
    owner: app
    # REMOVED 2026-09-01. This was a mechanism for keeping a second store in
    # step during a migration. There is no second store and no migration, so
    # the capability is not "absent pending work" — it is a recorded decision
    # not to have one. Do not reintroduce it. See CLAUDE.md.
    implementation_status: decision
    activation_status: n/a
    docs: [CLAUDE.md]
  - id: CAP-13
    name: Reconciliation Engine
    bucket: A
    owner: app
    implementation_status: full
    activation_status: active
