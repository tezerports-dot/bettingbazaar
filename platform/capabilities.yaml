  # ── D. Redis Platform ──────────────────────────────────────────────────────
  - id: CAP-21
    name: Redis Cache
    bucket: A
    owner: app
    implementation_status: full
    activation_status: active
    evidence: [backend/services/cache.service.js]
  - id: CAP-22
    name: Distributed Locks
    bucket: A
    owner: app
    # PARTIAL as of 2026-09-01, and this is a real gap, not bookkeeping.
    # startup/cronLock.js elects a leader using a TTL document in the store
    # being removed — despite Redis backing every other lock in the platform.
    # Until it is rewritten on PostgreSQL, scheduled jobs are guarded only by
    # their own idempotency, which for settlement means duplicated work on
    # every instance every tick. Its concurrency test went with the integration
    # tier and is restored in tests/postgres/ when the lock moves.
    implementation_status: partial
    activation_status: active
    evidence: [backend/startup/cronLock.js]
  - id: CAP-23
    name: Redis Sessions
    bucket: decision
    owner: app
    implementation_status: decision
    activation_status: 'n/a'
    # DECIDED 2026-08-11: stay stateless (PASETO/JWT, short TTL, refresh flow).
    # Server-side sessions buy INSTANT REVOCATION, which matters in this
    # industry for self-exclusion and fraud signals — but they make Redis a hard
    # dependency of authentication, and CAP-27 (Redis HA) is architecture-ready,
    # i.e. a single point of failure today. Trading "revocation is delayed by one
    # token TTL" for "a Redis outage logs everyone out" is the wrong way round
    # while HA is unprovisioned. REVISIT IF a regulator requires instant session
    # termination — and do CAP-27 first when revisiting.
    decision_outcome: stateless-tokens
    docs: [docs/governance/04-GOVERNANCE.md]
