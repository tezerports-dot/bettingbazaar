# GOVERNANCE: Read docs/governance/04-GOVERNANCE.md before editing this file.
# ══════════════════════════════════════════════════════════════════════════════
# PLATFORM CAPABILITY REGISTRY — machine-readable source of truth
# ══════════════════════════════════════════════════════════════════════════════
# Verified in CI by scripts/verify-capabilities.mjs (npm run verify:capabilities):
# every `evidence`, `verification.test`, and `docs` path MUST exist on disk, so a
# capability cannot silently rot while the registry claims it works.
#
# Buckets (owner's A/B/C model):
#   A        = build fully now (code-centric, valuable pre-prod)
#   B        = architecture built + configurable, ACTIVATED when infra exists
#   C        = infrastructure/ops owned; the app provides integration points only
#   decision = recorded architecture decision (intentionally not built)
#
# implementation_status: full | partial | architecture-ready | absent | decision
# activation_status:     active | dormant | infra-gated | volume-gated | n/a
# ══════════════════════════════════════════════════════════════════════════════
