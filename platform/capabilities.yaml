  - id: CAP-14
    name: Rollback Strategy
    bucket: A
    owner: app
    # Scoped to DEPLOYMENT rollback (redeploy the previous release, or flip the
    # blue/green selector), which is what remains real. The store-level rollback
    # plan this used to point at was the fallback path for a cutover between two
    # stores; both are gone. Data recovery is now PITR — see CAP-15.
    implementation_status: full
    activation_status: active
    docs: [docs/governance/04-GOVERNANCE.md, DEPLOYMENT.md]
    evidence: [deploy/k8s, ecosystem.config.cjs]

