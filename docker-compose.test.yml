# GOVERNANCE: Read docs/governance/04-GOVERNANCE.md before editing this file. (See sec.0 for mandatory pre-edit checklist.)
#
# The full test stack, locally. `npm run stack:up && npm run test:all`.
#
# ── Why this exists ─────────────────────────────────────────────────────────
# A money platform should not have a class of test that only a hosted runner
# can run. `npm run stack:up` brings up everything the suites need — the
# database, Redis — so `test:pg` and `test:redis` are runnable locally and a
# defect is caught in seconds rather than on a CI round trip.
#
# The stack used to also start a single-node replica set for the document
# store, because 31 call sites opened transactions against it and a standalone
# server refuses those. Both the store and those call sites are gone: money is
# transactional in PostgreSQL now, which needs no such arrangement.
#
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bb_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

# No named volumes on purpose. This stack is for TESTS: every run should start
# from an empty database, and a persisted volume is how a passing suite starts
# depending on rows an earlier run left behind — the same failure mode the
# truncate list had.
